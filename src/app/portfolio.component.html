<section class="portfolio">
    <h2>{{ heading }}</h2>
    <p>{{ description }}</p>
    <ul>
        <li>Project A — Example</li>
        <li>Project B — Example</li>

<h2>Users</h2>

<ul *ngIf="users$ | async as users">
    <li *ngFor="let u of users">
        {{ u.name }} — {{ u.email }}
    </li>
</ul>
